name: CI

# Every gate the repo has, in the order that fails fastest. Nothing here needs
# hardware. The layout matches neurolynq-web-sdk and neurolynq-web, so the
# three TypeScript repositories gate a pull request the same way.
#
# `pull_request` has no branch filter. It used to be limited to main, which
# left a stacked pull request (one based on another's branch, such as #158 and
# #159) with no build, test, lint or typecheck at all: only the format job ran.
# `push` to main tests main as it ends up, since two pull requests each green
# against an older main can merge into a main no run ever saw.
# workflow_dispatch runs it by hand on any ref.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref (rapid pushes, Dependabot rebases),
# but not on main, where each run is the record of a merged commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The lockfile is the point of a CI run: `npm install` could resolve a
      # different tree from the one a developer has.
      - name: Install dependencies
        run: npm ci

      # Formatting is not checked here: format-on-commit.yml rewrites it on push
      # instead.
      - name: Lint
        run: npm run lint

      # Nothing else type-checks the tests: tsconfig.json excludes them, vitest
      # transpiles without checking, and eslint reports lint rules rather than
      # compile errors. Without this step a test file that does not compile
      # still goes green.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The tests import src/, so this is the only step that loads what the
      # build produced: dist/ is what every consumer vendors. See the script's
      # header.
      - name: Check the built bundles
        run: npm run test:dist

      # The built bundles are what consumers vendor, so having them to hand
      # makes a mis-vendored copy easy to tell from a source problem.
      - name: Upload dist
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: ignore
